name: CI

on:
  pull_request:
  push:
    branches: [main, integration]

jobs:
  python-modules:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - feat/data-simulation
          - feat/distributed-api
          - feat/data-space
          - feat/edge-ai
          - feat/dashboard-devops/dashboard-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r ${{ matrix.module }}/requirements.txt
      - run: python -m pytest -q
        working-directory: ${{ matrix.module }}

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/integration -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: feat/dashboard-devops/dashboard }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: feat/dashboard-devops/dashboard/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker-smoke-test:
    needs: [python-modules, integration, dashboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d
      - run: docker compose --profile test run --rm smoke-test
      - if: failure()
        run: docker compose logs --tail 80
      - if: always()
        run: docker compose down -v
