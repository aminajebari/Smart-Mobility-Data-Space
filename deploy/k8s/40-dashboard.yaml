apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-api
  namespace: smart-mobility
  labels: {app: dashboard-api, tier: dashboard}
spec:
  replicas: 1
  selector:
    matchLabels: {app: dashboard-api}
  template:
    metadata:
      labels: {app: dashboard-api, tier: dashboard}
    spec:
      containers:
        - name: dashboard-api
          image: smds/dashboard-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: smds-config}
          env:
            - name: DASHBOARD_API_KEY
              valueFrom: {secretKeyRef: {name: smds-secrets, key: DASHBOARD_API_KEY}}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-api
  namespace: smart-mobility
spec:
  selector: {app: dashboard-api}
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: smart-mobility
  labels: {app: dashboard, tier: dashboard}
spec:
  replicas: 1
  selector:
    matchLabels: {app: dashboard}
  template:
    metadata:
      labels: {app: dashboard, tier: dashboard}
    spec:
      containers:
        - name: dashboard
          image: smds/dashboard:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - {name: DASHBOARD_API_UPSTREAM, value: "http://dashboard-api:8000"}
          readinessProbe:
            httpGet: {path: /healthz, port: 80}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 80}
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
# Exposed on the node: minikube service dashboard -n smart-mobility  (or http://<node-ip>:30080)
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: smart-mobility
spec:
  type: NodePort
  selector: {app: dashboard}
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
